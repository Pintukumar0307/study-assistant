services:
  # ── MongoDB ──────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: study_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: study_assistant
    volumes:
      - mongodb_data:/data/db
    networks:
      - study_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── ChromaDB ─────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: study_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - study_net

  # ── FastAPI AI Service ────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: study_ai_service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    volumes:
      - ai_uploads:/tmp/uploads
    depends_on:
      chromadb:
        condition: service_started
    networks:
      - study_net

  # ── Node.js Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/study_assistant
      AI_SERVICE_URL: http://ai-service:8000
      NODE_ENV: production
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - study_net

  # ── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: study_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - study_net

volumes:
  mongodb_data:
  chromadb_data:
  ai_uploads:
  backend_uploads:

networks:
  study_net:
    driver: bridge
